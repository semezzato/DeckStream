<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#1e293b" stroke-width="12" />
  <!-- Stream Deck 3x2 Keypad Matrix Grid -->
  <g filter="url(#glow)">
    <!-- Row 1 -->
    <rect x="96" y="112" width="88" height="88" rx="20" fill="#1e293b" stroke="#334155" stroke-width="6" />
    <circle cx="140" cy="156" r="14" fill="#ef4444" />
    
    <rect x="212" y="112" width="88" height="88" rx="20" fill="url(#accent)" stroke="#60a5fa" stroke-width="6" />
    <polygon points="248,140 268,156 248,172" fill="#ffffff" />
    
    <rect x="328" y="112" width="88" height="88" rx="20" fill="#1e293b" stroke="#334155" stroke-width="6" />
    <path d="M362 144 L382 144 M362 156 L382 156 M362 168 L374 168" stroke="#10b981" stroke-width="5" stroke-linecap="round" />

    <!-- Row 2 -->
    <rect x="96" y="228" width="88" height="88" rx="20" fill="#1e293b" stroke="#334155" stroke-width="6" />
    <!-- Volume wave -->
    <path d="M128 272 L138 272 L150 282 L150 262 L138 272 Z" fill="#f59e0b" />
    
    <rect x="212" y="228" width="88" height="88" rx="20" fill="#1e293b" stroke="#334155" stroke-width="6" />
    <!-- Music / sound note -->
    <path d="M246 280 A8 8 0 1 0 254 274 V250 L274 246 V270 A8 8 0 1 0 282 264 V240 L246 248 Z" fill="#a855f7" />

    <rect x="328" y="228" width="88" height="88" rx="20" fill="#1e293b" stroke="#334155" stroke-width="6" />
    <!-- Broadcast antenna -->
    <circle cx="372" cy="272" r="6" fill="#38bdf8" />
    <path d="M358 258 A20 20 0 0 1 386 258" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>
  <!-- Subtle brand text baseline -->
  <text x="256" y="380" font-family="sans-serif" font-weight="800" font-size="34" fill="#f8fafc" text-anchor="middle" letter-spacing="4">DECKSTREAM</text>
  <text x="256" y="415" font-family="sans-serif" font-weight="600" font-size="18" fill="#64748b" text-anchor="middle" letter-spacing="2">OBS STUDIO CONTROLLER</text>
</svg>
