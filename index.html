<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DeckStream — Controle o OBS pelo celular</title>
    <meta name="description" content="Use o celular como painel touch para trocar cenas, controlar o áudio e disparar efeitos no OBS Studio." />
    <meta property="og:title" content="DeckStream — Controle o OBS pelo celular" />
    <meta property="og:description" content="Use o celular como painel touch para trocar cenas, controlar o áudio e disparar efeitos no OBS Studio." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#07080c" />
    <script>
      (() => {
        const storageKey = 'deckstream_theme_mode';
        const validModes = ['dark', 'light', 'system'];
        let mode = 'dark';

        try {
          const savedMode = localStorage.getItem(storageKey);
          if (validModes.includes(savedMode)) mode = savedMode;
        } catch {}

        const followsDarkPreference = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? true;
        const isDark = mode === 'system' ? followsDarkPreference : mode === 'dark';
        const root = document.documentElement;

        root.classList.toggle('dark', isDark);
        root.classList.toggle('light', !isDark);
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDark ? '#07080c' : '#fafafa');
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DeckStream" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased selection:bg-blue-600 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
